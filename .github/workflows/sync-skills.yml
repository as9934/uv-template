name: Sync Skills

on:
  schedule:
    - cron: '0 9 * * 1'  # Weekly on Monday at 9am UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download latest skills from jamditis/claude-skills-journalism
        run: |
          curl -sL "https://raw.githubusercontent.com/jamditis/claude-skills-journalism/master/journalism-core/skills/data-journalism/SKILL.md" \
            -o .github/skills/data-journalism/SKILL.md
          curl -sL "https://raw.githubusercontent.com/jamditis/claude-skills-journalism/master/journalism-core/skills/foia-requests/SKILL.md" \
            -o .github/skills/foia-requests/SKILL.md
          curl -sL "https://raw.githubusercontent.com/jamditis/claude-skills-journalism/master/dev-toolkit/skills/web-scraping/SKILL.md" \
            -o .github/skills/web-scraping/SKILL.md

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet .github/skills/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/skills/
          git commit -m "chore: sync skills from jamditis/claude-skills-journalism"
          git push
